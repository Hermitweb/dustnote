# DustNote 一键部署
#
# 快速启动（HTTP）：
#   docker compose up -d --build
#
# 带 HTTPS（自动证书）：
#   docker compose --profile tls up -d --build
#
# 停止：docker compose down
# 数据：命名卷 dustnote-data（持久化 SQLite）

services:
  dustnote:
    build:
      context: .
      dockerfile: server/Dockerfile
    container_name: dustnote
    restart: unless-stopped
    ports:
      - '${PORT:-8080}:3210'
    volumes:
      # 持久化 SQLite 数据库（命名卷，避免绑定挂载权限问题）
      - dustnote-data:/app/server/data
    environment:
      - NODE_ENV=production
      - PORT=3210
      - DB_PATH=/app/server/data/dustnote.db
      - WEB_ORIGIN=${WEB_ORIGIN:-http://localhost}
      - SERVER_VERSION=${SERVER_VERSION:-0.1.0}
      - JWT_SECRET=${JWT_SECRET:-dev-secret-change-me}
      - LOG_LEVEL=${LOG_LEVEL:-info}
    env_file:
      - .env
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost:3210/api/v1/health']
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    logging:
      driver: json-file
      options:
        max-size: '10m'
        max-file: '3'

  # 可选：Caddy 反向代理（自动 HTTPS）
  # 启用：docker compose --profile tls up -d
  caddy:
    image: caddy:2-alpine
    profiles: ['tls']
    restart: unless-stopped
    ports:
      - '80:80'
      - '443:443'
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - dustnote
    environment:
      - DOMAIN=${DOMAIN:-localhost}

volumes:
  dustnote-data:
  caddy-data:
  caddy-config:
