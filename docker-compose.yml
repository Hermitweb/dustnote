# DustNote 一键部署
#
# 快速启动（HTTP）：
#   docker compose up -d --build
#
# 带 HTTPS（自动证书）：
#   docker compose --profile tls up -d --build
#
# 停止：docker compose down
# 数据：命名卷 dustnote-data（持久化 SQLite）

services:
  dustnote:
    build:
      context: .
      dockerfile: server/Dockerfile
    container_name: dustnote
    restart: unless-stopped
    ports:
      - '${PORT:-8080}:3210'
    volumes:
      # 持久化 SQLite 数据库（命名卷，避免绑定挂载权限问题）
      - dustnote-data:/app/server/data
    environment:
      - NODE_ENV=production
      - PORT=3210
      - DB_PATH=/app/server/data/dustnote.db
      - WEB_ORIGIN=${WEB_ORIGIN:-http://localhost}
      - SERVER_VERSION=${SERVER_VERSION:-2.2.0}
      # 必填：未设置时 compose 直接报错，避免容器起来后才崩在 config-validate
      - JWT_SECRET=${JWT_SECRET:?请在 .env 中设置 JWT_SECRET（≥32 字符随机串）}
      # 反代后限流按真实客户端 IP 计数，见 server/src/app.ts
      - TRUST_PROXY=${TRUST_PROXY:-1}
      - LOG_LEVEL=${LOG_LEVEL:-info}
      # 客户端版本策略（详见 update-strategy.md §2.3）
      - MIN_CLIENT_VERSION=${MIN_CLIENT_VERSION:-2.0.2}
      - RECOMMENDED_CLIENT_VERSION=${RECOMMENDED_CLIENT_VERSION:-2.2.0}
      - FORCE_UPDATE_VERSION=${FORCE_UPDATE_VERSION:-}
      - EOL_DATE_FOR_V0=${EOL_DATE_FOR_V0:-}
    env_file:
      - .env
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost:3210/api/v1/health']
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    logging:
      driver: json-file
      options:
        max-size: '10m'
        max-file: '3'

  # 可选：Caddy 反向代理（自动 HTTPS）
  # 启用：docker compose --profile tls up -d
  caddy:
    image: caddy:2-alpine
    profiles: ['tls']
    restart: unless-stopped
    ports:
      - '80:80'
      - '443:443'
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - dustnote
    environment:
      - DOMAIN=${DOMAIN:-localhost}

volumes:
  dustnote-data:
  caddy-data:
  caddy-config:
