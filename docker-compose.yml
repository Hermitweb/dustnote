# DustNote 一键部署（一体化：web + nginx + API 单容器）
#
# 快速启动（HTTP）：
#   docker compose up -d --build
#
# 带 HTTPS（自动证书）：
#   docker compose --profile tls up -d --build
#
# 一键脚本（跨平台，自动装 Docker / 生成 .env / 配置镜像源）：
#   Linux/macOS：./deploy/deploy.sh
#   Windows：    powershell -ExecutionPolicy Bypass -File deploy\deploy.ps1
#
# 停止：docker compose down
# 数据：命名卷 dustnote-data（SQLite）+ dustnote-backups（自动备份）

services:
  dustnote:
    build:
      context: .
      dockerfile: Dockerfile # 一体化（nginx 服务 web 静态 + 反代 /api/ 到 3210）
      args:
        # 中国网络通过 --cn 传入 Aliyun/npmmirror，国外保持官方源
        APK_MIRROR: ${APK_MIRROR:-dl-cdn.alpinelinux.org}
        NPM_REGISTRY: ${NPM_REGISTRY:-}
    container_name: dustnote
    restart: unless-stopped
    ports:
      # 一体化 nginx 监听 80，web 与 /api/v1 共用此端口
      # 注意：Docker 发布端口绕过 ufw/firewalld 的 INPUT 规则；如需仅本机访问、
      # 由外部反代对外，改为 '- "127.0.0.1:${PORT:-8080}:80"'
      - '${PORT:-8080}:80'
    volumes:
      # 持久化 SQLite 数据库（一体化镜像数据目录为 /app/server/data）
      - dustnote-data:/app/server/data
      # 持久化自动备份（BACKUP_DIR=/app/server/backups）
      - dustnote-backups:/app/server/backups
    environment:
      - NODE_ENV=production
      - PORT=3210
      - DB_PATH=/app/server/data/dustnote.db
      - BACKUP_DIR=/app/server/backups
      - WEB_ORIGIN=${WEB_ORIGIN:-http://localhost}
      - SERVER_VERSION=${SERVER_VERSION:-2.5.18}
      # 必填：未设置时 compose 直接报错，避免容器起来后才崩在 config-validate
      - JWT_SECRET=${JWT_SECRET:?请在 .env 中设置 JWT_SECRET（≥32 字符随机串）}
      # 反代后限流按真实客户端 IP 计数，见 server/src/app.ts
      - TRUST_PROXY=${TRUST_PROXY:-1}
      - LOG_LEVEL=${LOG_LEVEL:-info}
      # 客户端版本策略（详见 update-strategy.md §2.3）
      - MIN_CLIENT_VERSION=${MIN_CLIENT_VERSION:-2.0.2}
      - RECOMMENDED_CLIENT_VERSION=${RECOMMENDED_CLIENT_VERSION:-2.5.18}
      - FORCE_UPDATE_VERSION=${FORCE_UPDATE_VERSION:-}
      - EOL_DATE_FOR_V0=${EOL_DATE_FOR_V0:-}
    env_file:
      - .env
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost:3210/api/v1/health']
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    logging:
      driver: json-file
      options:
        max-size: '10m'
        max-file: '3'

  # 可选：Caddy 反向代理（自动 HTTPS）
  # 启用：docker compose --profile tls up -d
  # 一体化容器已含 nginx（web + API），Caddy 仅做 TLS 终结 + 反代
  caddy:
    image: caddy:2-alpine
    profiles: ['tls']
    restart: unless-stopped
    ports:
      - '80:80'
      - '443:443'
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - dustnote
    environment:
      - DOMAIN=${DOMAIN:-localhost}

volumes:
  dustnote-data:
  dustnote-backups:
  caddy-data:
  caddy-config:
