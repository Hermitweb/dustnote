openapi: 3.1.0
info:
  title: DustNote API
  version: 2.5.12
  description: |
    尘心笔记 REST API。所有笔记内容以 E2EE 密文形式传输，服务端无法解密。
  license:
    name: MIT

servers:
  - url: /api/v1
    description: 同源部署

security:
  - BearerAuth: []

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    Error:
      type: object
      properties:
        error:
          type: string
        message:
          type: string
      required: [error]

    NoteRow:
      type: object
      properties:
        id: { type: string, format: uuid }
        ciphertext: { type: string, description: "E2EE 密文 JSON 字符串" }
        keyVersion: { type: integer }
        isPinned: { type: boolean }
        isFavorite: { type: boolean }
        deletedAt: { type: string, format: "date-time", nullable: true }
        version: { type: integer, description: "乐观锁版本号" }
        clientUpdatedAt: { type: string, format: "date-time" }
        serverUpdatedAt: { type: string, format: "date-time" }
        folderId: { type: string, format: uuid, nullable: true }
      required: [id, ciphertext, keyVersion, isPinned, isFavorite, version, clientUpdatedAt, serverUpdatedAt]

    Folder:
      type: object
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        parentId: { type: string, format: uuid, nullable: true }
        icon: { type: string, nullable: true }
        sortOrder: { type: integer }
        createdAt: { type: string, format: "date-time" }
        depth: { type: integer, enum: [1, 2] }
        branch: { type: string, enum: [work, personal], nullable: true }

    Template:
      type: object
      properties:
        id: { type: string }
        name: { type: string }
        description: { type: string }
        category: { type: string }
        icon: { type: string }
        content: { type: string }
        isPreset: { type: boolean }
        sortOrder: { type: integer }

    Share:
      type: object
      properties:
        id: { type: string, format: uuid }
        noteId: { type: string, format: uuid }
        token: { type: string }
        wrappedShareKey: { type: object }
        hasPassword: { type: boolean }
        expiresAt: { type: string, format: "date-time", nullable: true }
        viewCount: { type: integer }
        revoked: { type: boolean }
        createdAt: { type: string, format: "date-time" }

    UpdateManifest:
      type: object
      properties:
        serverVersion: { type: string }
        channel: { type: string }
        latest:
          type: object
          properties:
            version: { type: string }
            releaseDate: { type: string }
        minClientVersion: { type: string }
        recommendedClientVersion: { type: string }
        forceUpdateVersion: { type: string, nullable: true }

paths:
  /health:
    get:
      summary: 健康检查
      security: []
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean }
                  uptime: { type: number }
                  version: { type: string }
                  db: { type: string }

  /auth/status:
    get:
      summary: 检查鉴权状态
      security: []
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  initialized: { type: boolean }
                  deviceKnown: { type: boolean }
                  pwSalt: { type: string, nullable: true }

  /auth/setup:
    post:
      summary: 首次设置主密码
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                authKey: { type: string }
                recoveryAuthKey: { type: string }
                wrappedMasterKeyPw: { type: object }
                wrappedMasterKeyRc: { type: object }
                pwSalt: { type: string }
                rcSalt: { type: string }
                deviceName: { type: string }
      responses:
        "201":
          description: 创建成功
          content:
            application/json:
              schema:
                type: object
                properties:
                  accessToken: { type: string }
                  userId: { type: string, format: uuid }
                  deviceId: { type: string, format: uuid }

  /auth/unlock:
    post:
      summary: 解锁（验证密码）
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                authKey: { type: string }
                deviceName: { type: string }
      responses:
        "200":
          description: 解锁成功
          content:
            application/json:
              schema:
                type: object
                properties:
                  accessToken: { type: string }
                  userId: { type: string, format: uuid }
                  deviceId: { type: string, format: uuid }
                  wrappedMasterKey: { type: object }
        "401":
          description: 密码错误

  /auth/recover:
    post:
      summary: 恢复码重置密码
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                recoveryAuthKey: { type: string }
                deviceName: { type: string }
      responses:
        "200":
          description: 恢复成功

  /auth/refresh:
    post:
      summary: 刷新 access token
      responses:
        "200":
          description: 刷新成功
          content:
            application/json:
              schema:
                type: object
                properties:
                  accessToken: { type: string }

  /notes:
    get:
      summary: 获取笔记列表
      parameters:
        - name: since
          in: query
          schema: { type: string, format: "date-time" }
          description: 增量同步游标
        - name: includeDeleted
          in: query
          schema: { type: string, enum: ["0", "1"] }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  notes:
                    type: array
                    items: { $ref: "#/components/schemas/NoteRow" }
    post:
      summary: 创建笔记
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                id: { type: string, format: uuid }
                ciphertext: { type: string }
                keyVersion: { type: integer }
                isPinned: { type: boolean }
                isFavorite: { type: boolean }
                clientUpdatedAt: { type: string, format: "date-time" }
                folderId: { type: string, format: uuid, nullable: true }
      responses:
        "201":
          description: 创建成功

  /notes/{id}:
    patch:
      summary: 更新笔记（乐观锁）
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                ciphertext: { type: string }
                isPinned: { type: boolean }
                isFavorite: { type: boolean }
                deletedAt: { type: string, nullable: true }
                clientUpdatedAt: { type: string, format: "date-time" }
                version: { type: integer, description: "当前版本号（乐观锁）" }
                folderId: { type: string, nullable: true }
      responses:
        "200":
          description: 更新成功
        "409":
          description: 版本冲突
          content:
            application/json:
              schema:
                type: object
                properties:
                  error: { type: string }
                  message: { type: string }
                  current: { $ref: "#/components/schemas/NoteRow" }
    delete:
      summary: 软删除笔记
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: 删除成功

  /folders:
    get:
      summary: 获取文件夹列表
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  folders:
                    type: array
                    items: { $ref: "#/components/schemas/Folder" }
    post:
      summary: 创建文件夹
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string }
                parentId: { type: string, format: uuid, nullable: true }
                branch: { type: string, enum: [work, personal] }
      responses:
        "201":
          description: 创建成功

  /shares:
    get:
      summary: 获取分享列表
      responses:
        "200":
          description: OK
    post:
      summary: 创建分享链接
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                noteId: { type: string, format: uuid }
                ciphertext: { type: object }
                wrappedShareKey: { type: object }
                password: { type: string, minLength: 8, maxLength: 64 }
                expiresIn: { type: integer, description: "秒" }
      responses:
        "201":
          description: 创建成功

  /templates:
    get:
      summary: 获取模板列表
      responses:
        "200":
          description: OK
    post:
      summary: 创建自定义模板
      responses:
        "201":
          description: 创建成功

  /preferences:
    patch:
      summary: 更新偏好设置
      responses:
        "200":
          description: 更新成功

  /update-manifest:
    get:
      summary: 获取更新清单
      security: []
      parameters:
        - name: X-Client-Version
          in: header
          schema: { type: string }
        - name: X-Client-Platform
          in: header
          schema: { type: string, enum: [web, desktop, android, ios, miniprogram] }
        - name: X-Client-Channel
          in: header
          schema: { type: string, enum: [nightly, canary, beta, stable] }
        - name: X-Client-Device-Id
          in: header
          schema: { type: string }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/UpdateManifest" }
