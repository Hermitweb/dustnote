# DustNote 容器进程管理
# nginx（80 端口，静态 + API 反代）+ node server（3210 端口）

[supervisord]
nodaemon=true
user=root

[program:server]
command=node /app/server/dist/index.js
directory=/app/server
user=dustnote
autostart=true
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:nginx]
command=nginx -g "daemon off;"
autostart=true
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
