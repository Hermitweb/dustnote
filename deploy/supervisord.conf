# DustNote 容器进程管理
# nginx（8080 端口，静态 + API 反代）+ node server（3210 端口）
#
# 审计 SEC-008：容器内不保留 root——supervisord 自身以 dustnote 身份运行
# （Dockerfile 的 USER dustnote），因此：
#   1. 不再设置 [supervisord] user=（非 root supervisor 无法 setuid）
#   2. 各 program 不设 user=（同样需要 root 才能降权；进程本来就是 dustnote）
# 若把容器改回以 root 运行，supervisord 仍可正常启动（user= 缺省即继承）。

[supervisord]
nodaemon=true
# 非 root 无法写默认日志路径；supervisord 自身日志丢弃，程序输出走 /dev/stdout
logfile=/dev/null
logfile_maxbytes=0

[program:server]
command=node /app/server/dist/index.js
directory=/app/server
autostart=true
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:nginx]
command=nginx -g "daemon off;"
autostart=true
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
