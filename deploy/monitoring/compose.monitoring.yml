# DustNote 监控栈（P0-2，2026-09-25）——独立 compose 文件，不并进主 compose：
# 主栈升级/回滚永不触碰监控；监控挂了不影响业务。
#
# 启用（服务器上，仓库 checkout 内执行）：
#   cd deploy/monitoring
#   cp .env.monitoring.example .env.monitoring   # 至少填 NTFY_TOPIC（随机难猜串）
#   docker compose -f compose.monitoring.yml --env-file .env.monitoring up -d
#
# 前提：主栈 .env 已设 METRICS_ENABLED=true 与 METRICS_TOKEN（本栈经宿主 8080 抓取）。
#
# 告警链路：prometheus（30s 抓 dustnote /metrics + 自身存活）→ rules.yml 判定
# → alertmanager 分组去重 → ntfy-bridge（15 行 node，无第三方镜像）→ ntfy 推送手机。
# 端到端演练：scripts/alert-drill.sh（拔容器→2 分钟内收到 DustnoteEndpointDown）。

name: dustnote-monitoring

services:
  prometheus:
    image: prom/prometheus:v2.55.1
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=30d
      # （remote write API 默认关闭 = lifecycle 管理默认不可用，无需显式 flag；
      #  曾写 --web.enable_lifecycle=false 因下划线拼错导致 v2.55 启动循环，
      # 2026-09-25 部署实锤）
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ../prometheus/rules.yml:/etc/prometheus/rules.yml:ro
      # 抓取主栈 /metrics 的 Bearer token（纯文本单行）。env 展开方案实测不可靠，
      # 见 prometheus.yml 注释；生成：grep ^METRICS_TOKEN 主栈 .env | cut -d= -f2 > /opt/metrics-token.txt
      - ${METRICS_TOKEN_FILE:-/opt/metrics-token.txt}:/run/dustnote/metrics-token:ro
      - prom-data:/prometheus
    extra_hosts:
      # 抓宿主上主容器的 /metrics（主栈发布在 ${PORT:-8080}）
      - 'host.docker.internal:host-gateway'
    ports:
      - '127.0.0.1:9090:9090' # 仅本机可查面板，远程走 SSH 隧道

  alertmanager:
    image: prom/alertmanager:v0.28.1
    restart: unless-stopped
    command:
      - --config.file=/etc/alertmanager/alertmanager.yml
      - --storage.path=/alertmanager
    volumes:
      - ./alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - am-data:/alertmanager
    ports:
      - '127.0.0.1:9093:9093'
    depends_on:
      - ntfy-bridge

  # Alertmanager webhook → ntfy 推送的最小桥（无外部镜像依赖，node 官方镜像
  # 与主栈构建共用缓存）。订阅方法：手机装 ntfy → 订阅 .env.monitoring 里的 topic。
  ntfy-bridge:
    image: node:22-alpine
    restart: unless-stopped
    working_dir: /app
    command: ['node', 'bridge.mjs']
    environment:
      - NTFY_SERVER=${NTFY_SERVER:-https://ntfy.sh}
      - NTFY_TOPIC=${NTFY_TOPIC:?请在 .env.monitoring 设置 NTFY_TOPIC（随机难猜字符串）}
    volumes:
      - ./bridge.mjs:/app/bridge.mjs:ro
    ports: []

volumes:
  prom-data:
  am-data:
