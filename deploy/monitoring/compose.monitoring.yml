# DustNote 监控栈（P0-2，2026-09-25）——独立 compose 文件，不并进主 compose：
# 主栈升级/回滚永不触碰监控；监控挂了不影响业务。
#
# 启用（服务器上，仓库 checkout 内执行）：
#   cd deploy/monitoring
#   cp .env.monitoring.example .env.monitoring   # 至少填 NTFY_TOPIC（随机难猜串）
#   docker compose -f compose.monitoring.yml --env-file .env.monitoring up -d
#
# 前提：主栈 .env 已设 METRICS_ENABLED=true 与 METRICS_TOKEN（本栈经宿主 8080 抓取）。
#
# 告警链路：prometheus（30s 抓 dustnote /metrics + 自身存活）→ rules.yml 判定
# → alertmanager 分组去重 → ntfy-bridge（自写 node，可注入多个 ntfy 目标）→ 手机推送。
# 端到端演练：scripts/alert-drill.sh（拔容器→2 分钟内收到 DustnoteEndpointDown）。

name: dustnote-monitoring

services:
  prometheus:
    image: prom/prometheus:v2.55.1
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=30d
      # （remote write API 默认关闭 = lifecycle 管理默认不可用，无需显式 flag；
      #  曾写 --web.enable_lifecycle=false 因下划线拼错导致 v2.55 启动循环，
      # 2026-09-25 部署实锤）
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ../prometheus/rules.yml:/etc/prometheus/rules.yml:ro
      # 抓取主栈 /metrics 的 Bearer token（纯文本单行）。env 展开方案实测不可靠，
      # 见 prometheus.yml 注释；生成：grep ^METRICS_TOKEN 主栈 .env | cut -d= -f2 > /opt/metrics-token.txt
      - ${METRICS_TOKEN_FILE:-/opt/metrics-token.txt}:/run/dustnote/metrics-token:ro
      - prom-data:/prometheus
    extra_hosts:
      # 抓宿主上主容器的 /metrics（主栈发布在 ${PORT:-8080}）
      - 'host.docker.internal:host-gateway'
    ports:
      - '127.0.0.1:9090:9090' # 仅本机可查面板，远程走 SSH 隧道

  alertmanager:
    image: prom/alertmanager:v0.28.1
    restart: unless-stopped
    command:
      - --config.file=/etc/alertmanager/alertmanager.yml
      - --storage.path=/alertmanager
    volumes:
      - ./alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - am-data:/alertmanager
    ports:
      - '127.0.0.1:9093:9093'
    depends_on:
      - ntfy-bridge

  # Alertmanager webhook → ntfy 推送的最小桥（无外部镜像依赖，node 官方镜像
  # 与主栈构建共用缓存）。订阅方法：手机装 ntfy → 订阅 .env.monitoring 里的 topic。
  ntfy-bridge:
    image: node:22-alpine
    restart: unless-stopped
    working_dir: /app
    command: ['node', 'bridge.mjs']
    environment:
      - NTFY_SERVER=${NTFY_SERVER:-https://ntfy.sh}
      - NTFY_TOPIC=${NTFY_TOPIC:?请在 .env.monitoring 设置 NTFY_TOPIC（随机难猜字符串）}
    volumes:
      - ./bridge.mjs:/app/bridge.mjs:ro
    ports: []

  # 自托管 ntfy（2026-10-02 R1 收口配套）。为什么必须自己跑一个：此前 NTFY_SERVER 被
  # 手改成 http://ntfy:5000，而本文件从未定义 ntfy 服务——最后一跳的目标根本不存在，
  # 告警从来到不了手机，而旧 bridge 照样回 ok:true（详见 docs/roadmap.md 同名落）。
  #
  # 只绑 127.0.0.1：手机侧要能订阅还缺一条 DNS A 记录（*.iniess.cn 泛解析指向另一台
  # 154.217.234.79），记录补齐后再加 TLS 反代、把 NTFY_SERVER 里公网那项摘掉。
  # 在它可用之前，bridge 同时投自托管与公网两个目标，任一路送达即算送达。
  ntfy:
    image: binwiederhier/ntfy:v2.28.0
    restart: unless-stopped
    command: ['serve']
    # 唯一一个必须显式写的旋钮，而且是实测出来的：镜像里 ntfy 默认监听 :80（日志
    # 'Listening on :80[http]'），而 bridge 要按 http://ntfy:5000 投它、宿主也按
    # 127.0.0.1:5000 发布它 —— 不设这一行就是 connection refused。注意配置键走环境
    # 变量时连字符要写成下划线（是 NTFY_LISTEN_HTTP，不是 NTFY_LISTEN-HISTORY 那种拼法），
    # 写错不会报错、只会静默不生效，所以这里刻意只留这一个旋钮并写清来源。
    environment:
      - NTFY_LISTEN_HTTP=:5000
    volumes:
      - ntfy-data:/var/lib/ntfy
    ports:
      - '127.0.0.1:5000:5000' # 仅本机；对外一律经反代 + TLS

volumes:
  ntfy-data:
  prom-data:
  am-data:
