# Alertmanager 路由（P0-2）：所有告警 → ntfy-bridge → 手机推送。
# critical（宕机/5xx 激增）立即提醒并重复；warning（备份停摆/锁定激增/库变大）
# 静默 30 分钟聚批，避免单节点维护者被告警疲劳。
route:
  receiver: ntfy
  group_by: ['alertname']
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h
  routes:
    - matchers:
        - severity = "critical"
      receiver: ntfy
      group_wait: 10s
      repeat_interval: 1h
    - matchers:
        - severity = "warning"
      receiver: ntfy
      group_interval: 30m
      repeat_interval: 24h

receivers:
  - name: ntfy
    webhook_configs:
      - url: http://ntfy-bridge:9095/publish
        send_resolved: true

inhibit_rules:
  # 端点已宕机时，5xx 比率/备份等派生告警被抑制（根因优先）
  - source_matchers:
      - alertname = "DustnoteEndpointDown"
    target_matchers:
      - severity = "warning"
    equal: []
