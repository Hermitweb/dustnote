# Prometheus 主配置（P0-2）。告警规则复用仓库既有的
# deploy/prometheus/rules.yml（OBS-R01 批次产物），此处只负责接线。
# 环境变量（METRICS_TOKEN）由 compose --env-file 注入展开。

global:
  scrape_interval: 30s
  evaluation_interval: 30s

alerting:
  alertmanagers:
    - static_configs:
        - targets: ['alertmanager:9093']

rule_files:
  - /etc/prometheus/rules.yml

scrape_configs:
  - job_name: dustnote
    metrics_path: /metrics
    static_configs:
      - targets: ['host.docker.internal:8080']
    # METRICS_TOKEN 必填（compose env 注入；与主栈 .env 的值保持一致）。
    # 注意不能留空——Prometheus 对空 credentials 直接拒绝加载配置，
    # 因此启用监控栈要求主栈先开启 METRICS_ENABLED+METRICS_TOKEN。
    authorization:
      type: Bearer
      credentials: ${METRICS_TOKEN}

  - job_name: prometheus
    static_configs:
      - targets: ['localhost:9090']

  - job_name: alertmanager
    static_configs:
      - targets: ['alertmanager:9093']
