# Prometheus 主配置（P0-2）。告警规则复用仓库既有的
# deploy/prometheus/rules.yml（OBS-R01 批次产物），此处只负责接线。
# 环境变量（METRICS_TOKEN）由 compose --env-file 注入展开。

global:
  scrape_interval: 30s
  evaluation_interval: 30s

alerting:
  alertmanagers:
    - static_configs:
        - targets: ['alertmanager:9093']

rule_files:
  - /etc/prometheus/rules.yml

scrape_configs:
  - job_name: dustnote
    metrics_path: /metrics
    static_configs:
      - targets: ['host.docker.internal:8080']
    # token 走 credentials_file（2026-09-25 部署实锤：${METRICS_TOKEN} env 展开
    # 在此挂载链路上发出空 credentials → node 层 401，而容器 env 里 token 完好）。
    # credentials_file 不做 env 展开、配置里不落明文，由 compose 只读挂载
    # /opt/metrics-token.txt（纯 token 单行，600 权限，主栈 METRICS_TOKEN 同值）
    authorization:
      type: Bearer
      credentials_file: /run/dustnote/metrics-token

  - job_name: prometheus
    static_configs:
      - targets: ['localhost:9090']

  - job_name: alertmanager
    static_configs:
      - targets: ['alertmanager:9093']
