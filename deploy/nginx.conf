# DustNote nginx 反代配置（生产就绪）
#
# 部署链路（见 Dockerfile）：
#   外部 LB / Cloudflare 终结 SSL → 转发 HTTP 到容器:80 → 本 nginx
#   因此容器内只监听 80，SSL/TLS 配置在外部 LB
#
# 安全头清单（满足 production-checklist.md §3）：
#   - HSTS (Strict-Transport-Security)：2 年 + preload + 子域名
#     即使本 server 监听 80，HSTS 仍由 LB 在 443 响应中下发；
#     此处保留以便裸机部署直连 80 时也能下发（浏览器首次访问后强制 HTTPS）
#   - CSP：限制脚本/样式/连接来源，防存储型/反射型 XSS
#   - X-Content-Type-Options: nosniff：防 MIME 嗅探
#   - X-Frame-Options: DENY：防点击劫持（CSP frame-ancestors 的旧浏览器等价）
#   - Referrer-Policy: no-referrer：防 URL 含敏感参数泄露
#   - Permissions-Policy：禁用相机/麦克风/地理位置等不必要能力
#
# 裸机部署（不经 LB，nginx 直接终结 SSL）：
#   将 listen 改为 443 ssl; http2 on;
#   添加 ssl_certificate / ssl_certificate_key / ssl_protocols TLSv1.3
#   另加 server { listen 80; return 301 https://$host$request_uri; }

upstream api {
    server 127.0.0.1:3210;
}

# 限流 zone：每 IP 20 req/s，突发 30（防 L7 洪水，express 层是第二道防线）
limit_req_zone $binary_remote_addr zone=dustnote_api:10m rate=20r/s;

server {
    listen 80 default_server;
    server_name _;

    # --- 安全头 ---
    # HSTS：2 年 + preload + 子域名
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    # CSP：connect-src 收紧到 'self'（同源 ws/wss 浏览器自动匹配 host，不再放行任意 ws: wss:）
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), interest-cohort=()" always;

    # 静态文件（web/dist）
    root /app/web-dist;
    index index.html;

    # gzip
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 256;

    # API 反代
    location /api/ {
        limit_req zone=dustnote_api burst=30 nodelay;

        proxy_pass http://api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket 支持（同步推送）
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 86400s;

        # API 响应不缓存
        add_header Cache-Control "no-store" always;
    }

    # SPA fallback：非 /api 的请求都返回 index.html
    location / {
        try_files $uri $uri/ /index.html;

        # 静态文件缓存（Vite 产出带 hash，可长期缓存）
        # 注意：嵌套 location 的 add_header 会覆盖父级，故此处需重复列出安全头
        location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff2?)$ {
            expires 30d;
            add_header Cache-Control "public, immutable";
            add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
            add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
            add_header X-Content-Type-Options "nosniff" always;
            add_header X-Frame-Options "DENY" always;
            add_header Referrer-Policy "no-referrer" always;
            add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), interest-cohort=()" always;
        }
    }

    # index.html 不缓存（保证发版后立即生效）
    location = /index.html {
        add_header Cache-Control "no-cache" always;
        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), interest-cohort=()" always;
    }
}
