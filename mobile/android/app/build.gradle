apply plugin: "com.android.application"
apply plugin: "org.jetbrains.kotlin.android"
apply plugin: "com.facebook.react"

react {
  // pnpm (node-linker=hoisted) hoists react-native to the workspace root
  // node_modules/. The plugin default resolves to mobile/node_modules/react-native
  // which does not exist in this layout, so point at the workspace root instead.
  //
  // ReactExtension properties are Kotlin `val`s backed by Gradle Properties.
  // We use .set() explicitly (rather than `=`) because Groovy `=` assignment
  // does not reliably override a Property convention at configuration time.
  //
  // IMPORTANT: We do NOT override `root` (default = ${rootProject.dir}/../ = mobile/).
  // The `root` property is used by detectedEntryFile() to locate index.js and by
  // detectOSAwareHermesCommand() to locate hermesc. Overriding `root` to the
  // workspace root would break entryFile resolution (workspace root has no index.js;
  // the entry file lives at mobile/index.js). The hermesc path
  // (mobile/node_modules/react-native/sdks/hermesc/...) is handled by the CI
  // symlink step that mirrors workspace-root packages into mobile/node_modules/.
  reactNativeDir.set(file("../../../node_modules/react-native"))
  codegenDir.set(file("../../../node_modules/@react-native/codegen"))
  // Explicit entry file: mobile/index.js (relative to mobile/android/app/).
  entryFile.set(file("../../index.js"))
}

def enableProguardInReleaseBuilds = false
def jscFlavor = 'org.webkit:android-jsc:+'

/**
 * Release signing config resolution.
 *
 * Priority:
 *   1. Environment variables (CI):  DUSTNOTE_STORE_FILE / _STORE_PASSWORD /
 *      _KEY_ALIAS / _KEY_PASSWORD 鈥?point at a pre-decoded keystore path.
 *   2. Local dev: ../keystore.properties (gitignored) next to the android/
 *      project root, referencing app/dustnote-release.keystore.
 *   3. Fallback: debug keystore (keeps `assembleRelease` working before a
 *      release keystore exists; safe for local Debug-only builds).
 *
 * keystore.properties is gitignored. CI regenerates it from the
 * ANDROID_KEYSTORE_BASE64 GitHub secret (see .github/workflows/release.yml).
 */
def releaseStoreFile = null
def releaseStorePassword = null
def releaseKeyAlias = null
def releaseKeyPassword = null

// CI 閫氳繃 GITHUB_ENV / step env 娉ㄥ叆 DUSTNOTE_*銆傚綋 secret 鏈厤缃椂锛?// GitHub Actions 浼氭妸绌哄瓧绗︿覆娉ㄥ叆鐜鍙橀噺锛堣€岄潪涓嶆敞鍏ワ級锛?// System.env.VAR 姝ゆ椂杩斿洖 "" 鑰岄潪 null锛屾晠蹇呴』鍚屾椂鎺掗櫎绌轰覆锛?// 鍚﹀垯 file("") 浼氭姏 "path may not be null or empty string" 瀵艰嚧閰嶇疆闃舵澶辫触銆?def envStoreFile = System.env.DUSTNOTE_STORE_FILE
if (envStoreFile != null && envStoreFile.length() > 0) {
  releaseStoreFile = file(envStoreFile)
  releaseStorePassword = System.env.DUSTNOTE_STORE_PASSWORD
  releaseKeyAlias = System.env.DUSTNOTE_KEY_ALIAS
  releaseKeyPassword = System.env.DUSTNOTE_KEY_PASSWORD
} else {
  def keystorePropsFile = rootProject.file("keystore.properties")
  if (keystorePropsFile.exists()) {
    def props = new Properties()
    keystorePropsFile.withInputStream { props.load(it) }
    releaseStoreFile = file(props['storeFile'])
    releaseStorePassword = props['storePassword']
    releaseKeyAlias = props['keyAlias']
    releaseKeyPassword = props['keyPassword']
  }
}

android {
  ndkVersion rootProject.ext.ndkVersion
  buildToolsVersion rootProject.ext.buildToolsVersion
  compileSdk rootProject.ext.compileSdkVersion

  namespace "com.dustnote"
  defaultConfig {
    applicationId "com.dustnote"
    minSdkVersion rootProject.ext.minSdkVersion
    targetSdkVersion rootProject.ext.targetSdkVersion
    versionCode 30
    versionName "2.5.7"
    // Explicitly list supported ABIs to exclude the residual `armeabi` (ARMv5)
    // directory. minSdk=23 guarantees armeabi-v7a+ on all devices, but a
    // third-party .so (libconceal.so) ships an armeabi variant that produces an
    // incomplete lib/armeabi/ in the APK (only 1 of 48 .so files). Filtering
    // here keeps the APK clean and avoids any theoretical UnsatisfiedLinkError
    // on a device that wrongly selects armeabi over armeabi-v7a.
    ndk {
      abiFilters 'arm64-v8a', 'armeabi-v7a', 'x86', 'x86_64'
    }
  }
  signingConfigs {
    debug {
      storeFile file('debug.keystore')
      storePassword 'android'
      keyAlias 'androiddebugkey'
      keyPassword 'android'
    }
    // Release signing is only registered when credentials are resolvable.
    // If absent, release builds fall back to the debug config so `assembleRelease`
    // still works for local dev / CI dry-runs.
    if (releaseStoreFile != null && releaseStoreFile.exists()) {
      release {
        storeFile releaseStoreFile
        storePassword releaseStorePassword
        keyAlias releaseKeyAlias
        keyPassword releaseKeyPassword
      }
    }
  }
  buildTypes {
    debug {
      signingConfig signingConfigs.debug
    }
    release {
      // Groovy 灞炴€ц闂湪 signingConfigs 鍧楁湭瀹氫箟 release 鏃朵細鎶?      // MissingPropertyException锛堟棤娉曠敤 != null 闃插尽锛夛紝鏁呯敤 findByName
      // 瀹夊叏鏌ユ壘锛涙湭閰嶇疆 release keystore 鏃跺洖閫€鍒?debug 绛惧悕銆?      signingConfig signingConfigs.findByName('release') != null
        ? signingConfigs.release
        : signingConfigs.debug
      minifyEnabled enableProguardInReleaseBuilds
      proguardFiles getDefaultProguardFile("proguard-android.txt"), "proguard-rules.pro"
    }
  }
}

dependencies {
  implementation("com.facebook.react:react-android")

  if (hermesEnabled.toBoolean()) {
    implementation("com.facebook.react:hermes-android")
  } else {
    implementation jscFlavor
  }
}

// React Native autolinking (RN 0.74 API).
// applyNativeModulesAppBuildGradle(project) does three things the app build
// depends on:
//   1. Adds `implementation project(':react-native-<module>')` for every
//      autolinked native module discovered from package.json (without this the
//      subprojects are included by settings.gradle but never wired into :app).
//   2. Registers the `generatePackageList` task (run before preBuild) that
//      writes PackageList.java to build/generated/rncli/. MainApplication.kt
//      imports com.facebook.react.PackageList; without this task the Kotlin
//      compile fails with "Unresolved reference: PackageList".
//   3. Adds build/generated/rncli/src/main/java to the main source set so the
//      generated PackageList.java is visible to the compiler.
// This is the standard RN 0.74 template line; the older
// `react { autolinkLibrariesWithApp() }` DSL was removed in 0.74 and is NOT
// used here.
apply from: file("../../node_modules/@react-native-community/cli-platform-android/native_modules.gradle"); applyNativeModulesAppBuildGradle(project)
