apply plugin: "com.android.application"
apply plugin: "org.jetbrains.kotlin.android"
apply plugin: "com.facebook.react"

react {
  // pnpm (node-linker=hoisted) hoists react-native to the workspace root
  // node_modules/. The plugin default resolves to mobile/node_modules/react-native
  // which does not exist in this layout, so point at the workspace root instead.
  //
  // ReactExtension properties are Kotlin `val`s backed by Gradle Properties.
  // We use .set() explicitly (rather than `=`) because Groovy `=` assignment
  // does not reliably override a Property convention at configuration time.
  //
  // IMPORTANT: We do NOT override `root` (default = ${rootProject.dir}/../ = mobile/).
  // The `root` property is used by detectedEntryFile() to locate index.js and by
  // detectOSAwareHermesCommand() to locate hermesc. Overriding `root` to the
  // workspace root would break entryFile resolution (workspace root has no index.js;
  // the entry file lives at mobile/index.js). The hermesc path
  // (mobile/node_modules/react-native/sdks/hermesc/...) is handled by the CI
  // symlink step that mirrors workspace-root packages into mobile/node_modules/.
  reactNativeDir.set(file("../../../node_modules/react-native"))
  codegenDir.set(file("../../../node_modules/@react-native/codegen"))
  // Explicit entry file: mobile/index.js (relative to mobile/android/app/).
  entryFile.set(file("../../index.js"))
}

def enableProguardInReleaseBuilds = false
def jscFlavor = 'org.webkit:android-jsc:+'

android {
  ndkVersion rootProject.ext.ndkVersion
  buildToolsVersion rootProject.ext.buildToolsVersion
  compileSdk rootProject.ext.compileSdkVersion

  namespace "com.dustnote"
  defaultConfig {
    applicationId "com.dustnote"
    minSdkVersion rootProject.ext.minSdkVersion
    targetSdkVersion rootProject.ext.targetSdkVersion
    versionCode 1
    versionName "0.1.0"
  }
  signingConfigs {
    debug {
      storeFile file('debug.keystore')
      storePassword 'android'
      keyAlias 'androiddebugkey'
      keyPassword 'android'
    }
  }
  buildTypes {
    debug {
      signingConfig signingConfigs.debug
    }
    release {
      signingConfig signingConfigs.debug
      minifyEnabled enableProguardInReleaseBuilds
      proguardFiles getDefaultProguardFile("proguard-android.txt"), "proguard-rules.pro"
    }
  }
}

dependencies {
  implementation("com.facebook.react:react-android")

  if (hermesEnabled.toBoolean()) {
    implementation("com.facebook.react:hermes-android")
  } else {
    implementation jscFlavor
  }
}
