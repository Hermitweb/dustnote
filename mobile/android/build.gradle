// Top-level build file
buildscript {
  ext {
    buildToolsVersion = "34.0.0"
    minSdkVersion = 23
    compileSdkVersion = 34
    targetSdkVersion = 34
    ndkVersion = "26.1.10909125"
    kotlinVersion = "1.9.22"
  }
  repositories {
    maven { url 'https://maven.aliyun.com/repository/public' }
    maven { url 'https://maven.aliyun.com/repository/google' }
    maven { url 'https://maven.aliyun.com/repository/gradle-plugin' }
    google()
    mavenCentral()
  }
  dependencies {
    classpath("com.android.tools.build:gradle")
    classpath("com.facebook.react:react-native-gradle-plugin")
    classpath("org.jetbrains.kotlin:kotlin-gradle-plugin")
  }
}

apply plugin: "com.facebook.react.rootproject"

// pnpm (node-linker=hoisted) hoists react-native to the workspace root
// node_modules/. The ReactPluginExtension default resolves to
// mobile/node_modules/react-native which does not exist in this layout, so
// override it on the root project to point at the workspace root instead.
// ReactExtension on :app inherits this convention.
react {
  reactNativeDir = file("../../node_modules/react-native")
  codegenDir = file("../../node_modules/@react-native/codegen")
}

allprojects {
  repositories {
    maven { url 'https://maven.aliyun.com/repository/public' }
    maven { url 'https://maven.aliyun.com/repository/google' }
    maven { url 'https://maven.aliyun.com/repository/gradle-plugin' }
    google()
    mavenCentral()
  }
}
