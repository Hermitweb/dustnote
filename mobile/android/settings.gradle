rootProject.name = 'DustNote'
// node-linker=hoisted 时依赖提升到仓库根 node_modules（../../../），
// 独立/非 hoisted 布局在 mobile/node_modules（../../）。双路径探测兼容两种。
def nmGradle = file("../../node_modules/@react-native-community/cli-platform-android/native_modules.gradle")
def nmPrefix = "../../node_modules"
if (!nmGradle.exists()) {
    nmGradle = file("../../../node_modules/@react-native-community/cli-platform-android/native_modules.gradle")
    nmPrefix = "../../../node_modules"
}
apply from: nmGradle; applyNativeModulesSettingsGradle(settings)
include ':app'
includeBuild("${nmPrefix}/@react-native/gradle-plugin")
