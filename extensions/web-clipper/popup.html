<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    body { width: 360px; padding: 16px; font-family: -apple-system, sans-serif; font-size: 14px; }
    h1 { font-size: 16px; margin: 0 0 12px; display: flex; align-items: center; gap: 8px; }
    .logo { font-size: 20px; }
    label { display: block; margin: 8px 0 4px; font-weight: 500; }
    input, textarea, select { width: 100%; padding: 8px; border: 1px solid #ddd; border-radius: 6px; font-size: 13px; box-sizing: border-box; }
    textarea { height: 80px; resize: vertical; }
    button { width: 100%; padding: 10px; background: #16a34a; color: white; border: none; border-radius: 8px; font-size: 14px; font-weight: 600; cursor: pointer; margin-top: 12px; }
    button:hover { background: #15803d; }
    button:disabled { background: #ccc; cursor: not-allowed; }
    .status { margin-top: 8px; padding: 8px; border-radius: 6px; font-size: 13px; display: none; }
    .status.ok { display: block; background: #dcfce7; color: #166534; }
    .status.err { display: block; background: #fef2f2; color: #991b1b; }
    .config { margin-bottom: 12px; }
    .config a { color: #16a34a; text-decoration: none; }
  </style>
</head>
<body>
  <h1><span class="logo">📝</span> DustNote Web Clipper</h1>

  <div id="config-section" class="config" style="display:none;">
    <label for="server-url">Server URL</label>
    <input id="server-url" placeholder="http://your-server:8080" />
    <label for="token">Access Token</label>
    <input id="token" type="password" placeholder="Paste your access token" />
    <button id="save-config">Save & Connect</button>
  </div>

  <div id="clip-section" style="display:none;">
    <label for="title">Title</label>
    <input id="title" />
    <label for="content">Content</label>
    <textarea id="content"></textarea>
    <label for="url">Source URL</label>
    <input id="url" readonly />
    <button id="clip-btn">Save to DustNote</button>
  </div>

  <div id="status" class="status"></div>

  <script src="popup.js"></script>
</body>
</html>
