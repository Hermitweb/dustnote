# ARM64 桌面构建可行性试验（手动触发，不发布）
#
# 目的：在正式把 aarch64-pc-windows-msvc 加进 release.yml 之前，验证
# GitHub windows runner 的 MSVC ARM64 工具链 + Tauri NSIS 打包能否产出
# DustNote_<ver>_arm64-setup.exe。跑通后此 workflow 可保留作回归探针，
# 也可随 release.yml 集成一并维护。

name: Desktop Windows ARM64 Build Test

on:
  workflow_dispatch:

concurrency:
  group: desktop-arm64-test
  cancel-in-progress: true

jobs:
  arm64-build:
    name: Build Desktop (win-arm64) test
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
        with:
          version: '9.12.0'
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'pnpm'
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-pc-windows-msvc
      - name: Ensure ARM64 Rust target (explicit, in crate dir so the override applies)
        working-directory: desktop/src-tauri
        run: rustup target add aarch64-pc-windows-msvc
      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri
      - name: Install dependencies (skip native build scripts)
        run: pnpm install --frozen-lockfile --ignore-scripts
      - run: pnpm --filter @dustnote/shared build && pnpm --filter @dustnote/client-core build
      - name: Build Tauri app for ARM64 (NSIS)
        working-directory: desktop
        shell: pwsh
        run: |
          Write-Host "RUSTUP_TOOLCHAIN=$env:RUSTUP_TOOLCHAIN"
          where.exe rustup
          rustup target list --installed
          rustup target add aarch64-pc-windows-msvc
          rustup target list --installed
          pnpm tauri build --target aarch64-pc-windows-msvc --bundles nsis
      - name: List NSIS outputs
        shell: bash
        run: |
          echo "=== aarch64 bundle dir ==="
          ls -la desktop/src-tauri/target/aarch64-pc-windows-msvc/release/bundle/nsis/ || true
          echo "=== main exe ==="
          ls -la desktop/src-tauri/target/aarch64-pc-windows-msvc/release/ | grep -i dustnote || true
      - name: Upload arm64 NSIS exe
        uses: actions/upload-artifact@v5
        with:
          name: desktop-nsis-win-arm64
          path: desktop/src-tauri/target/aarch64-pc-windows-msvc/release/bundle/nsis/*.exe
          if-no-files-found: error
