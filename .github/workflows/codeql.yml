# CodeQL 静态安全扫描（审计 TEST-006）
# 每次推送/PR 到主开发线 + 每周定时扫描 JS/TS；结果进 GitHub Security tab
name: CodeQL

on:
  push:
    branches: [main, dev, 'dev/**']
  pull_request:
    branches: [main]
  schedule:
    # 每周六 04:00 UTC 扫一次（捕获新披露的漏洞模式）
    - cron: '0 4 * * 6'

permissions:
  contents: read
  security-events: write

jobs:
  analyze:
    name: Analyze (javascript-typescript)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      # pnpm 必须先于 setup-node 的 cache: 'pnpm' 安装（否则 setup-node
      # 找不到 pnpm 可执行文件直接失败——首次运行实锤）
      - uses: pnpm/action-setup@v4
        with:
          version: '9.12.0'
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'pnpm'
      # CodeQL 需要真实的依赖树做数据流分析；与 e2e 同策略：
      # 装原生构建工具 + 不加 --ignore-scripts
      - name: Install native build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential python3
      - run: pnpm install --frozen-lockfile
      - uses: github/codeql-action/init@v3
        with:
          languages: javascript-typescript
          # 只扫描源码目录，排除构建产物/测试夹具/锁文件噪音
          queries: security-extended
      - uses: github/codeql-action/analyze@v3
        with:
          category: '/language:javascript-typescript'
