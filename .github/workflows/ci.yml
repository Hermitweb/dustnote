name: CI

on:
  push:
    # dev/** 通配：工作分支形如 dev/setup-and-fixes，此前只写 [main, dev] 导致
    # 该分支上的全部 CI（lint/typecheck/test/audit/e2e）从未运行（技术债排查发现）
    # fix/** 同理补入（2026-09-25：fix/audit-2026-09-19 上的 mobile 测试基建
    # 若不在触发面内，等于又造了一个"CI 从未跑过"的暗仓）
    branches: [main, dev, 'dev/**', 'fix/**']
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '.trae/**'
  pull_request:
    branches: [main, dev]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '.trae/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  NODE_VERSION: '22'
  PNPM_VERSION: '9.12.0'

jobs:
  lint:
    name: Lint & Format
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: pnpm format:check
      - run: pnpm lint
      - name: Verify miniprogram theme tokens match shared seeds
        run: pnpm --filter @dustnote/shared build && node scripts/gen-mp-tokens.mjs --check
      - name: Test alerting bridge (P0-2 last hop)
        run: pnpm test:monitoring

      - name: Check i18n keys
        run: node scripts/check-i18n.mjs
      - name: Verify SW_VERSION matches package.json
        run: node scripts/check-sw-version.mjs
      - name: Verify README badge version matches package.json
        run: node scripts/check-readme-version.mjs

  typecheck:
    name: TypeScript Type Check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'
      - name: Install native build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential python3
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck

  test:
    name: Unit Tests (node ${{ matrix.node }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [lint, typecheck]
    # 审计 TEST-007：engines 声明 >=20 <25，矩阵验证三个 LTS 线
    strategy:
      fail-fast: false
      matrix:
        node: [20, 22, 24]
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node }}
          cache: 'pnpm'
      - name: Install native build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential python3
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      # 审计 TEST-002：覆盖率阈值仅在 --coverage 时生效，此前 CI 从不跑，
      # 阈值形同虚设。在单个 matrix 节点上强制执行覆盖率门禁（低于阈值即 fail）。
      - name: Coverage gate (enforce thresholds)
        if: matrix.node == 22
        run: pnpm test:coverage

  audit:
    name: Security Audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile --ignore-scripts
      # 审计豁免清单（显式登记，附理由；未登记的 high/critical 仍会 fail）。
      # 历史：2026-08 安全治理后，B 类 16 项传递依赖漏洞已通过 pnpm.overrides
      # 精确锁版本修复（vm2/minimatch/nanoid/postcss×2/autoprefixer/js-yaml×2/
      # svgo/form-data/serialize-javascript/tmp/http-cache-semantics/adm-zip/glob），
      # 豁免清单已收缩至仅剩无补丁项：
      #
      # C 类 · 无补丁 / 包已废弃（官方无修复版本，只能豁免，待 Taro 主版本升级替换）：
      #   swiper        @tarojs/components 钉死 swiper 6.x（运行时依赖，无法单独升级）
      #   decompress    @tarojs/cli > download-git-repo（模板下载链路，包已废弃）
      #   git-clone     @tarojs/cli > download-git-repo
      #   html-minifier @tarojs/webpack5-runner（包已废弃）
      #   image-size ×2 desktop vite>less 与 mobile metro 传递依赖，<=2.0.2 全线无修复
      #   xmldom ×13    mobile > @react-native-voice/voice > @expo/config-plugins
      #                 > @expo/plist > xmldom。原包已废弃（无修复版本）；@expo/plist
      #                 只在 expo config-plugin 阶段（构建期）执行，不进入 Metro 运行时包。
      #                 后续可考虑 override 别名到维护中的 @xmldom/xmldom，但会改动
      #                 Android 预构建链路，需真机构建验证后再做（勿盲改）。
      # 上述漏洞均位于构建期工具链（image-size 除外，但同样无修复版本可升），
      # 不进入发往用户的运行时产物。
      #
      # 2026-09 新增（有补丁 → 已用 pnpm.overrides 修复，不豁免）：
      #   @xmldom/xmldom  web > mammoth（.docx 导入）**运行时路径** → override ^0.8.15
      #   browserslist    desktop > autoprefixer          → override ^4.28.7
      #   fast-uri        小程序构建链 > ajv              → override 3.1.5 → ^3.1.6
      #   js-yaml ×2      eslint / 小程序构建链          → override 抬到 3.15.2 / 4.3.2
      #   svgo            小程序构建链                    → override 2.8.3 → 2.8.4
      - name: Security Audit
        run: |
          set +e
          pnpm audit --audit-level=high --json > audit.json
          set -e
          node -e "
            const fs = require('fs');
            const audit = JSON.parse(fs.readFileSync('audit.json', 'utf8'));
            const ignored = new Set([
              // C 类：无补丁 / 已废弃，待 Taro 主版本升级根治
              'GHSA-hmx5-qpq5-p643', // swiper critical：@tarojs/components 钉死 6.x
              'GHSA-mp2f-45pm-3cg9', // decompress critical：download-git-repo 链路
              'GHSA-8jmw-wjr8-2x66', // git-clone：download-git-repo 链路
              'GHSA-pfq8-rq6v-vf5m', // html-minifier：webpack5-runner
              'GHSA-w3rx-r6r6-pgpr', 'GHSA-5p2g-fcmc-qvqq', // image-size：less/metro
              // xmldom：已废弃无修复版本，仅经 @expo/plist 在构建期执行
              'GHSA-crh6-fp67-6883', 'GHSA-wh4c-j3r5-mjhp', 'GHSA-2v35-w6hq-6mfw',
              'GHSA-f6ww-3ggp-fr8h', 'GHSA-x6wf-f3px-wcqx', 'GHSA-j759-j44w-7fr8',
              'GHSA-w2rr-34g9-rvrj', 'GHSA-4w3w-2rp5-g8jm', 'GHSA-c7q8-3ch8-vqpv',
              'GHSA-27p8-2357-5qqv', 'GHSA-8344-3jmq-59r6', 'GHSA-965w-775f-mr7g',
              'GHSA-93r5-fhx6-vmg9',
            ]);
            const bad = Object.values(audit.advisories || {})
              .filter(a => (a.severity === 'high' || a.severity === 'critical') && !ignored.has(a.github_advisory_id));
            if (bad.length) {
              console.error('Unignored high/critical vulnerabilities found:');
              bad.forEach(a => console.error('  - ' + a.severity + ' ' + a.module_name + ' (' + a.github_advisory_id + ')'));
              process.exit(1);
            }
            console.log('No unignored high/critical vulnerabilities.');
          "
        shell: bash
      # §10/§12/§15：每次发版自动生成 CycloneDX SBOM（软件物料清单）
      # --ignore-npm-errors：本仓库用 pnpm（hoisted 布局），cyclonedx-npm 内部走
      # `npm ls`，npm 会把 pnpm 的链接结构判成 extraneous/invalid 并退出 254。
      # 加该开关后仍会基于可识别的依赖树产出 BOM（代价：部分嵌套依赖可能缺失）。
      - name: Generate SBOM (CycloneDX)
        run: npx @cyclonedx/cyclonedx-npm --ignore-npm-errors --output-file sbom.xml
      - uses: actions/upload-artifact@v5
        with:
          name: sbom
          path: sbom.xml
          if-no-files-found: warn

  build-web:
    name: Build Web
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [lint, typecheck, test, audit]
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'
      - name: Install native build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential python3
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @dustnote/shared build && pnpm --filter @dustnote/client-core build
      - run: pnpm --filter @dustnote/web build
      - name: List web dist
        run: ls -la web/dist/ || true
      - name: Check bundle size
        run: |
          # 审计 TEST-004：仅统计 JS 资产（排除 .map，源码映射改由错误监控平台
          # 单独上传，不进制品），并在超阈值时 exit 1 真正阻塞合并（此前只 warning）。
          js_bytes=$(find web/dist -type f -name '*.js' ! -name '*.map' -printf '%s\n' 2>/dev/null | awk '{s+=$1} END {print s+0}')
          kb=$((js_bytes / 1024))
          max_kb=$((2 * 1024))
          echo "Web JS bundle size: ${kb} KB (budget ${max_kb} KB)"
          if [ "$kb" -gt "$max_kb" ]; then
            echo "::error::JS bundle size ${kb} KB exceeds ${max_kb} KB budget"
            exit 1
          fi
      - uses: actions/upload-artifact@v5
        with:
          name: web-dist
          path: web/dist/
          if-no-files-found: warn

  build-server:
    name: Build Server
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [lint, typecheck, test, audit]
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'
      - name: Install native build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential python3
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @dustnote/shared build && pnpm --filter @dustnote/client-core build
      - run: pnpm --filter @dustnote/server build
      - name: List server dist
        run: ls -la server/dist/ || true
      - uses: actions/upload-artifact@v5
        with:
          name: server-dist
          path: server/dist/
          if-no-files-found: warn

  build-miniprogram:
    name: Build Miniprogram (H5)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [lint, typecheck, test, audit]
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: pnpm --filter @dustnote/shared build && pnpm --filter @dustnote/client-core build
      - run: pnpm --filter @dustnote/miniprogram build:h5
      - name: List miniprogram dist
        run: ls -la miniprogram/dist/ || true
      - uses: actions/upload-artifact@v5
        with:
          name: miniprogram-h5-dist
          path: miniprogram/dist/
          if-no-files-found: warn

  build-miniprogram-weapp:
    name: Build Miniprogram (WeApp)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [lint, typecheck, test, audit]
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: pnpm --filter @dustnote/shared build && pnpm --filter @dustnote/client-core build
      - run: pnpm --filter @dustnote/miniprogram build:weapp
      - name: List weapp dist
        run: ls -la miniprogram/dist/ || true
      - uses: actions/upload-artifact@v5
        with:
          name: miniprogram-weapp-dist
          path: miniprogram/dist/
          if-no-files-found: warn

  build-desktop:
    name: Build Desktop (Web)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [lint, typecheck, test, audit]
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: pnpm --filter @dustnote/shared build && pnpm --filter @dustnote/client-core build
      - run: pnpm --filter @dustnote/desktop build:web
      - name: List desktop dist
        run: ls -la desktop/dist/ || true
      - uses: actions/upload-artifact@v5
        with:
          name: desktop-web-dist
          path: desktop/dist/
          if-no-files-found: warn

  native-compat:
    name: Native Module Compatibility
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'
      - name: Install native build tools (Ubuntu)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential python3
      - name: Install native build tools (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install python || true
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @dustnote/shared build && pnpm --filter @dustnote/client-core build
      - run: pnpm --filter @dustnote/server build
      - run: pnpm --filter @dustnote/server test

  build-android:
    name: Build Android (Debug APK)
    runs-on: ubuntu-latest
    timeout-minutes: 35
    needs: [lint, typecheck, test, audit]
    # Android 构建较慢且对 RN 升级敏感，作为 mobile 端回归保护。
    # 硬性门禁：Android 构建失败必须阻塞合并，避免破坏性变更静默通过。
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'
      - uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'
      - name: Install Android SDK & CMake
        # cmake;3.22.1: react-native-quick-crypto 使用 externalNativeBuild + CMakeLists.txt
        # 构建 C++/JSI 原生代码，runner 预装 SDK 可能缺 CMake
        uses: android-actions/setup-android@v3
        with:
          packages: 'cmake;3.22.1'
      - name: Install native build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential python3
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @dustnote/shared build && pnpm --filter @dustnote/client-core build
      # 与 release.yml 同款（完整理由见该文件同名步骤）：pnpm hoisted 布局下
      # ① RN gradle 插件按 mobile/node_modules/react-native/sdks/hermesc 找
      #    编译器（缺它 createBundleDebugJsAndAssets 直接失败）；
      # ② Metro/autolinking 需要 react 与 react-native* 系链接到与根 node_modules
      #    同一份 hoisted 副本（pnpm junction 是另一份 → 双 React 实例启动崩溃）；
      # ③ @dustnote 工作区包供 Metro 解析。此前本 job 缺这步,首次运行即暴露。
      - name: Symlink react-native into mobile/node_modules (pnpm hoisted layout)
        run: |
          mkdir -p mobile/node_modules
          if [ -e "node_modules/react" ]; then
            rm -f "mobile/node_modules/react"
            ln -s "$(pwd)/node_modules/react" "mobile/node_modules/react"
          fi
          for pkg in node_modules/react-native node_modules/react-native-* \
                     node_modules/@react-native node_modules/@react-native-*; do
            [ -e "$pkg" ] || continue
            name=$(basename "$pkg")
            rm -f "mobile/node_modules/$name" && ln -s "$(pwd)/$pkg" "mobile/node_modules/$name"
          done
          mkdir -p mobile/node_modules/@dustnote
          for ws_pkg in shared client-core; do
            [ -d "$ws_pkg" ] || continue
            rm -f "mobile/node_modules/@dustnote/$ws_pkg"
            ln -s "$(pwd)/$ws_pkg" "mobile/node_modules/@dustnote/$ws_pkg"
          done
      - name: Build Android Debug APK
        working-directory: mobile/android
        env:
          GRADLE_OPTS: '-Dorg.gradle.daemon=false -Dorg.gradle.network.timeout=300000'
        run: |
          chmod +x ./gradlew
          ./gradlew assembleDebug --no-daemon
      - name: Upload APK artifact
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: android-debug-apk
          path: mobile/android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: warn

  docker:
    name: Build & Push Docker Image
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [build-server]
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Lowercase owner
        id: owner_lc
        run: echo "owner_lc=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v5
        with:
          context: .
          # 根 Dockerfile = web 静态资源 + API + nginx 的一体镜像，
          # 与 README/docker-compose 的一键部署一致。server/Dockerfile 是仅 API 的变体。
          file: Dockerfile
          push: true
          platforms: linux/amd64,linux/arm64
          # 仓库名必须全小写（owner "Hermitweb" 经 tolower 转换）
          tags: |
            ghcr.io/${{ steps.owner_lc.outputs.owner_lc }}/dustnote:latest
            ghcr.io/${{ steps.owner_lc.outputs.owner_lc }}/dustnote:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  e2e-smoke:
    name: E2E (Playwright smoke)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
        with:
          version: 9.12.0
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'pnpm'
      - name: Install native build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential python3
      # 与其他「要真跑运行时」的 job（test / build-server / native-compat）一致：
      # 不能加 --ignore-scripts —— 本 job 的 webServer 会真启后端，而 better-sqlite3
      # 的原生二进制由 install 脚本（prebuild-install）产出，跳过脚本会 import 失败、
      # 后端 exit 1、webServer 起不来（此前该 job 从未运行过，问题被掩盖）
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @dustnote/shared build && pnpm --filter @dustnote/client-core build
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm exec playwright test
      - uses: actions/upload-artifact@v5
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
