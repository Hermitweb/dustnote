name: CI

on:
  push:
    branches: [main, dev]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '.trae/**'
  pull_request:
    branches: [main, dev]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '.trae/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  NODE_VERSION: '22'
  PNPM_VERSION: '9.12.0'

jobs:
  lint:
    name: Lint & Format
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: pnpm format:check
      - run: pnpm lint
      - name: Check i18n keys
        run: node scripts/check-i18n.mjs

  typecheck:
    name: TypeScript Type Check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'
      - name: Install native build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential python3
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck

  test:
    name: Unit Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [lint, typecheck]
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'
      - name: Install native build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential python3
      - run: pnpm install --frozen-lockfile
      - run: pnpm test

  audit:
    name: Security Audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile --ignore-scripts
      # 审计豁免清单（显式登记，附理由；未登记的 high/critical 仍会 fail）。
      # 历史：2026-08 安全治理后，B 类 16 项传递依赖漏洞已通过 pnpm.overrides
      # 精确锁版本修复（vm2/minimatch/nanoid/postcss×2/autoprefixer/js-yaml×2/
      # svgo/form-data/serialize-javascript/tmp/http-cache-semantics/adm-zip/glob），
      # 豁免清单已收缩至仅剩无补丁项：
      #
      # C 类 · 无补丁 / 包已废弃（官方无修复版本，只能豁免，待 Taro 主版本升级替换）：
      #   swiper        @tarojs/components 钉死 swiper 6.x（运行时依赖，无法单独升级）
      #   decompress    @tarojs/cli > download-git-repo（模板下载链路，包已废弃）
      #   git-clone     @tarojs/cli > download-git-repo
      #   html-minifier @tarojs/webpack5-runner（包已废弃）
      #   image-size ×2 desktop vite>less 与 mobile metro 传递依赖，<=2.0.2 全线无修复
      # 上述漏洞均位于构建期工具链（image-size 除外，但同样无修复版本可升），
      # 不进入发往用户的运行时产物。
      - name: Security Audit
        run: |
          set +e
          pnpm audit --audit-level=high --json > audit.json
          set -e
          node -e "
            const fs = require('fs');
            const audit = JSON.parse(fs.readFileSync('audit.json', 'utf8'));
            const ignored = new Set([
              // C 类：无补丁 / 已废弃，待 Taro 主版本升级根治
              'GHSA-hmx5-qpq5-p643', // swiper critical：@tarojs/components 钉死 6.x
              'GHSA-mp2f-45pm-3cg9', // decompress critical：download-git-repo 链路
              'GHSA-8jmw-wjr8-2x66', // git-clone：download-git-repo 链路
              'GHSA-pfq8-rq6v-vf5m', // html-minifier：webpack5-runner
              'GHSA-w3rx-r6r6-pgpr', 'GHSA-5p2g-fcmc-qvqq', // image-size：less/metro
            ]);
            const bad = Object.values(audit.advisories || {})
              .filter(a => (a.severity === 'high' || a.severity === 'critical') && !ignored.has(a.github_advisory_id));
            if (bad.length) {
              console.error('Unignored high/critical vulnerabilities found:');
              bad.forEach(a => console.error('  - ' + a.severity + ' ' + a.module_name + ' (' + a.github_advisory_id + ')'));
              process.exit(1);
            }
            console.log('No unignored high/critical vulnerabilities.');
          "
        shell: bash
      # §10/§12/§15：每次发版自动生成 CycloneDX SBOM（软件物料清单）
      - name: Generate SBOM (CycloneDX)
        run: npx @cyclonedx/cyclonedx-npm --output-file sbom.xml
      - uses: actions/upload-artifact@v5
        with:
          name: sbom
          path: sbom.xml
          if-no-files-found: warn

  build-web:
    name: Build Web
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [lint, typecheck, test, audit]
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'
      - name: Install native build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential python3
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @dustnote/shared build && pnpm --filter @dustnote/client-core build
      - run: pnpm --filter @dustnote/web build
      - name: List web dist
        run: ls -la web/dist/ || true
      - name: Check bundle size
        run: |
          total=$(du -sb web/dist/ | cut -f1)
          kb=$((total / 1024))
          max_kb=$((5 * 1024))
          echo "Web bundle size: ${kb} KB"
          if [ "$kb" -gt "$max_kb" ]; then
            echo "::warning::Bundle size ${kb} KB exceeds ${max_kb} KB threshold"
          fi
      - uses: actions/upload-artifact@v5
        with:
          name: web-dist
          path: web/dist/
          if-no-files-found: warn

  build-server:
    name: Build Server
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [lint, typecheck, test, audit]
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'
      - name: Install native build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential python3
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @dustnote/shared build && pnpm --filter @dustnote/client-core build
      - run: pnpm --filter @dustnote/server build
      - name: List server dist
        run: ls -la server/dist/ || true
      - uses: actions/upload-artifact@v5
        with:
          name: server-dist
          path: server/dist/
          if-no-files-found: warn

  build-miniprogram:
    name: Build Miniprogram (H5)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [lint, typecheck, test, audit]
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: pnpm --filter @dustnote/shared build && pnpm --filter @dustnote/client-core build
      - run: pnpm --filter @dustnote/miniprogram build:h5
      - name: List miniprogram dist
        run: ls -la miniprogram/dist/ || true
      - uses: actions/upload-artifact@v5
        with:
          name: miniprogram-h5-dist
          path: miniprogram/dist/
          if-no-files-found: warn

  build-miniprogram-weapp:
    name: Build Miniprogram (WeApp)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [lint, typecheck, test, audit]
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: pnpm --filter @dustnote/shared build && pnpm --filter @dustnote/client-core build
      - run: pnpm --filter @dustnote/miniprogram build:weapp
      - name: List weapp dist
        run: ls -la miniprogram/dist/ || true
      - uses: actions/upload-artifact@v5
        with:
          name: miniprogram-weapp-dist
          path: miniprogram/dist/
          if-no-files-found: warn

  build-desktop:
    name: Build Desktop (Web)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [lint, typecheck, test, audit]
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: pnpm --filter @dustnote/shared build && pnpm --filter @dustnote/client-core build
      - run: pnpm --filter @dustnote/desktop build:web
      - name: List desktop dist
        run: ls -la desktop/dist/ || true
      - uses: actions/upload-artifact@v5
        with:
          name: desktop-web-dist
          path: desktop/dist/
          if-no-files-found: warn

  native-compat:
    name: Native Module Compatibility
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'
      - name: Install native build tools (Ubuntu)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential python3
      - name: Install native build tools (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install python || true
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @dustnote/shared build && pnpm --filter @dustnote/client-core build
      - run: pnpm --filter @dustnote/server build
      - run: pnpm --filter @dustnote/server test

  build-android:
    name: Build Android (Debug APK)
    runs-on: ubuntu-latest
    timeout-minutes: 35
    needs: [lint, typecheck, test, audit]
    # Android 构建较慢且对 RN 升级敏感，作为 mobile 端回归保护。
    # 硬性门禁：Android 构建失败必须阻塞合并，避免破坏性变更静默通过。
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'
      - uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'
      - name: Install Android SDK & CMake
        # cmake;3.22.1: react-native-quick-crypto 使用 externalNativeBuild + CMakeLists.txt
        # 构建 C++/JSI 原生代码，runner 预装 SDK 可能缺 CMake
        uses: android-actions/setup-android@v3
        with:
          packages: 'cmake;3.22.1'
      - name: Install native build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential python3
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @dustnote/shared build && pnpm --filter @dustnote/client-core build
      - name: Build Android Debug APK
        working-directory: mobile/android
        env:
          GRADLE_OPTS: '-Dorg.gradle.daemon=false -Dorg.gradle.network.timeout=300000'
        run: |
          chmod +x ./gradlew
          ./gradlew assembleDebug --no-daemon
      - name: Upload APK artifact
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: android-debug-apk
          path: mobile/android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: warn

  docker:
    name: Build & Push Docker Image
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [build-server]
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v5
        with:
          context: .
          # 根 Dockerfile = web 静态资源 + API + nginx 的一体镜像，
          # 与 README/docker-compose 的一键部署一致。server/Dockerfile 是仅 API 的变体。
          file: Dockerfile
          push: true
          platforms: linux/amd64,linux/arm64
          tags: |
            ghcr.io/${{ github.repository_owner }}/dustnote:latest
            ghcr.io/${{ github.repository_owner }}/dustnote:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  e2e-smoke:
    name: E2E (Playwright smoke)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
        with:
          version: 9.12.0
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: pnpm --filter @dustnote/shared build && pnpm --filter @dustnote/client-core build
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm exec playwright test
      - uses: actions/upload-artifact@v5
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
