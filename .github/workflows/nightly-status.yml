# 外部拨测（roadmap P0-1/P0-2）：从 GitHub 网络位置探测自托管实例。
# 与服务器本机监控互补——它看不见"整机宕机/ISP 断流"，GitHub 跑在外部网络，
# 挂了这个就是用户视角的"你的服务器没了"。失败自动开 issue（去重），
# 恢复自动关闭；issue + Actions 红邮件双通道即"零订阅告警"。
#
# 2026-09-29 教训：这个 workflow 的三个 uses 钉版 SHA 全是查无此 commit 的值
# （API 422），而 schedule 只在默认分支跑——于是它从写下那天起一次都没成功执行过，
# 合并进 main 后的第一次真跑直接挂。更糟的是它连「我坏了」都报不出来：开 issue 的
# 步骤在同一个 job 里，job 起不来就没有 issue。所以钉版可解析性改由
# `pnpm action:pins` 守（在每次 push 都跑的 lint job 里，不依赖本 workflow）。

name: Status Probe

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch: {}

permissions:
  issues: write

jobs:
  probe:
    name: Probe instance health
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0（与 ci.yml 同 major）
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
        with:
          version: 9
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 22
      - name: Run status probe
        run: node scripts/status-probe.mjs > probe.json
        continue-on-error: true
      - name: Evaluate
        run: |
          cat probe.json
          node -e "
          const r = JSON.parse(require('fs').readFileSync('probe.json','utf8'));
          if (!r.ok) { console.error('::error::status probe failed: ' + r.results.filter(x=>!x.ok).map(x=>x.name+'('+x.note+')').join(', ')); process.exit(1); }
          "
      - name: Open issue on failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node -e "
          const r = JSON.parse(require('fs').readFileSync('probe.json','utf8'));
          const bad = r.results.filter(x => !x.ok);
          const body = '拨测：' + r.url + '（期望版本 v' + r.expected + '）\n\n'
            + bad.map(x => '- **' + x.name + '**: ' + (x.note ?? 'HTTP ' + x.status)).join('\n')
            + '\n\nrun: ' + process.env.GITHUB_SERVER_URL + '/' + process.env.GITHUB_REPOSITORY + '/actions/runs/' + process.env.GITHUB_RUN_ID + '\n';
          require('fs').writeFileSync('issue-body.md', body);
          "
          EXISTING=$(gh issue list --state open --search "[status-probe] in:title" --json number --jq '.[0].number' || true)
          if [ -z "${EXISTING}" ]; then
            gh issue create --title "[status-probe] 外部拨测失败 $(date -u +%m-%d\ %H:%M)Z" --body-file issue-body.md
          else
            gh issue comment "${EXISTING}" --body-file issue-body.md || true
          fi
      - name: Close issue on recovery
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for n in $(gh issue list --state open --search "[status-probe] in:title" --json number --jq '.[].number'); do
            gh issue close "$n" --comment "拨测已恢复绿：${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          done
