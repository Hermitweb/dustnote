# 外部拨测（roadmap P0-1/P0-2）：从 GitHub 网络位置探测自托管实例。
# 与服务器本机监控互补——它看不见「整机宕机/ISP 断流」，GitHub 跑在外部网络，
# 挂了这个就是用户视角的「你的服务器没了」。失败自动开 issue（去重），恢复自动关闭。
#
# 这条 workflow 连着两轮以同一种方式失败：坏了，但不吭声。两段教训都留在文件里。
#
#  (1) 三个 uses 钉版 SHA 全是查无此 commit 的值（API 422），job 在 Set up job 阶段就死掉。
#      它进 main 之后 09-27 16:12 至 09-29 03:43 共 6 次排期运行，6 次全部这样失败，日志首条
#      错误一字不差；而「失败就开 issue」的步骤就在同一个 job 里，于是它连「我坏了」都说不
#      出口——那两天外部视角的验证量是 0。现在由 pnpm action:pins 守（每次 push 都跑，不依赖
#      被检查者自己），且可变引用的存在性也一并验。
#
#  (2) 钉版修好后的第一次运行：job 起来了，却死在 pnpm/action-setup 的版本冲突上（workflow
#      写 version: 9，package.json 的 packageManager 写 pnpm@9.12.0）。探针依然一步没跑，而
#      「开 issue」那步因为读不到 probe.json 也一起失败——结果还是没有 issue。
#
#  (3) 钉版与版本冲突都修好之后，2026-09-30 盘点发现第三层问题：docs/status.md 的生成区写着
#      「最近拨测：2026-09-27」，而 09-29 起十次排期拨测**全部成功**。原因是这个 workflow 只把
#      probe.json 传成 artifact，**既不传 --update、也没有任何提交**——探针算出的表格从来没落进
#      仓库。页面却写着「手改无效：下一次拨测会覆盖」。这不是配置错，是**承诺与实现不符**：
#      状态页存在的唯一意义就是「外部可核实的线上事实」，而它当时是一页 4 天没动的旧数据。
#      现在由下面的 publish job 负责把生成区提交回 main（带 [skip ci]，避免自己触发自己）。

#  所以根因不是某个配置写错，而是**报警器和被报警的东西在同一个失效域里**。下面把上报拆成
#  独立的 report job（needs: probe + if: failure()）：probe.json 缺失时它照样开单，写明
#  「探针未执行完成」。改动做过一次真演练（把 (2) 的冲突装回去），确认会响、也会自动关单。

name: Status Probe

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch: {}

permissions:
  issues: write

jobs:
  probe:
    name: Probe instance health
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
        # 刻意不写 version：让 action 去读 package.json 的 packageManager。两处各写一份就是
        # 上面 (2) 的直接原因（v4.3.0 起视为错误，不再静默取其一）。
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 22
          # 这个 job 不 install 任何依赖（拨测脚本零依赖），而 setup-node 的
          # package-manager-cache 默认为真：命中缓存时看不出问题，一旦 pnpm-lock.yaml
          # 变了、新 key 无缓存可恢复，store 目录就不存在，Post 保存缓存那步会直接报
          # Path Validation Error 把 job 跑红（PR #16 的 Docs workflow 实测如此）。
          # 用不到的缓存必须显式关掉。
          package-manager-cache: false
      - name: Run status probe
        run: node scripts/status-probe.mjs --update > probe.json
        # --update 让探针顺手重写 docs/status.md 的生成区。写不进去不算探测失败——
        # 那由下面的 publish job 单独报错，不混进「线上挂没挂」的判定里。
        continue-on-error: true
      - name: Evaluate
        run: |
          cat probe.json
          node -e "
          const r = JSON.parse(require('fs').readFileSync('probe.json','utf8'));
          if (!r.ok) { console.error('::error::status probe failed: ' + r.results.filter(x=>!x.ok).map(x=>x.name+'('+x.note+')').join(', ')); process.exit(1); }
          "
      - name: Publish probe result for the reporter
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: probe-json
          path: probe.json
          if-no-files-found: ignore
      - name: Upload the regenerated status page
        # 探针写进工作区的 docs/status.md 随作业传出来，交给 publish job 提交。
        # 刻意不在这里判红：文件没变（线上状态没动）是正常情形，不是故障。
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: status-md
          path: docs/status.md
          if-no-files-found: error
      - name: Close issue on recovery
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          for n in $(gh issue list --state open --search '[status-probe] in:title' --json number --jq '.[].number'); do
            gh issue close "$n" --comment "拨测已恢复绿：${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          done

  publish:
    name: Publish status page to main
    needs: probe
    # 只在探针成功时提交：拨测判红的时候，页面上那份旧数据至少比"把红色状态写进 main"
    # 更容易被注意到——红会由 report job 开 issue，不该由这里抢着改文档。
    if: success()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          # 用默认 GITHUB_TOKEN 提交，提交作者就是机器人身份；不配 SSH/key，少一处秘密。
          fetch-depth: 1
      - name: Fetch the regenerated status page
        # path 必须是 docs：upload-artifact v5 对单文件产物会拍平目录，下载到 . 得到的
        # 是 ./status.md 而不是 ./docs/status.md。这一度让本 job 全绿而 git diff 为空，
        # 于是「无变化不提交」把一次路径错误读成了正常情形，状态页照旧停在昨天。
        # 2026-10-01 第一次真跑才暴露——**流水线绿不等于事情做成了**。
        uses: actions/download-artifact@v5
        with:
          name: status-md
          path: docs
      - name: Guard - the page we are about to keep must be fresh
        # 这条自检是给上面那个路径错误准备的：作业可以全绿，但全绿不等于拿到的文件
        # 真是本次拨测写的。生成区时间戳若落后本次运行超过 1 小时，说明产物没落到
        # docs/status.md 上——那时「无变化不提交」是假阴性，必须响。
        run: |
          node -e "
          const fs = require("fs");
          const md = fs.readFileSync("docs/status.md", "utf8");
          const m = /最近拨测：([0-9-]{10} [0-9:]{5}) UTC/.exec(md);
          if (!m) {
            console.error("::error::docs/status.md 里找不到生成区时间戳，产物没落到该文件上");
            process.exit(1);
          }
          const stamp = Date.parse(m[1].replace(" ", "T") + "Z");
          const ageMin = (Date.now() - stamp) / 60000;
          if (!(ageMin >= -5 && ageMin < 60)) {
            console.error("::error::生成区时间戳 " + m[1] + " UTC 距本次运行 " + Math.round(ageMin) + " 分钟，超出 1 小时窗口");
            process.exit(1);
          }
          console.log("生成区新鲜：" + m[1] + " UTC（" + Math.round(ageMin) + " 分钟前）");
          "

      - name: Commit if changed
        env:
          RUN_URL: ${github.server_url}/${github.repository}/actions/runs/${github.run_id}
        run: |
          set -e
          if git diff --quiet -- docs/status.md; then
            echo "生成区无变化（线上状态未动），不提交。"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/status.md
          # [skip ci] 是必需的：这条提交落在 main 上，会再触发一次全量 CI 与一次拨测，
          # 而拨测又会提交一次——不切断就是自我循环的提交风暴。
          git commit -m "docs(status): 拨测生成区更新 [skip ci]" -m "由 Status Probe 作业生成，run: $RUN_URL"
          git push
      - name: Say so loudly if publishing failed
        if: failure()
        env:
          RUN_URL: ${github.server_url}/${github.repository}/actions/runs/${github.run_id}
        run: |
          echo "::error::拨测通过但状态页没提交出去——docs/status.md 会停在旧数据上，而页面自称「下一次拨测会覆盖」。看 $RUN_URL"

  report:
    name: Report probe failure
    needs: [probe, publish]
    # 独立 job：探针那侧无论怎么坏（包括「业务一步都没跑」的坏法），报警这条路都得是通的。
    if: failure()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # 不 checkout 仓库：上报只需要 runner 自带的 gh，少一处自己会坏的地方
      - name: Fetch probe result if there is one
        continue-on-error: true
        uses: actions/download-artifact@v5
        with:
          name: probe-json
      - name: Open or update issue
        env:
          GH_TOKEN: ${{ github.token }}
          # gh 需要 repo 上下文。本 job 刻意不 checkout（少一处会坏的地方），那就必须显式给；
          # 演练实测：不给就是「正文生成成功、gh issue create 却 exit 1」——报警器自己哑掉。
          GH_REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          # 探针绿、但状态页没提交出去，是**另一种**故障：不是线上挂了，是报告板挂了。
          # 两者必须分开说，否则读者会按「服务器宕机」去查，而真正过期的是 docs/status.md。
          PUBLISH_RESULT: ${needs.publish.result}
        run: |
          node -e "
          const fs = require('fs');
          const NL = String.fromCharCode(10);
          const run = process.env.RUN_URL;
          let body;
          try {
            const r = JSON.parse(fs.readFileSync('probe.json', 'utf8'));
            const bad = (r.results || []).filter((x) => !x.ok);
            const detail = bad.length
              ? bad.map((x) => '- **' + x.name + '**: ' + (x.note || 'HTTP ' + x.status)).join(NL)
              : '（整体判红但无单项明细，见 run 日志）';
            const publishFailed = process.env.PUBLISH_RESULT && process.env.PUBLISH_RESULT !== 'success';
            if (r.ok && publishFailed) {
              // 探针全绿却进了这里 => 红的是 publish job
              body = '**状态页发布失败**：拨测本身全部通过，但 docs/status.md 没提交出去。' + NL + NL +
                '这不是线上故障，而是**报告板故障**——页面会停在旧数据上，而它自称「下一次拨测会覆盖」。' +
                '按此口径读到的任何「绿」都要先看生成区时间戳。' + NL + NL + 'run: ' + run;
            } else {
              body = '拨测：' + r.url + '（期望版本 v' + r.expected + '）' + NL + NL + detail +
                NL + NL + 'run: ' + run;
            }
          } catch (e) {
            // 这就是 2026-09-29 那两次的情形：probe.json 压根不存在，探针一步都没跑。
            body = '**探针未执行完成**：probe.json 读不到（' + e.message + '）。' + NL + NL +
              '这既不是「线上正常」也不是「线上挂了」，而是**哨兵自己没站起来**——' +
              '按 nightly-status.yml 头部教训 (1)/(2) 定位是哪一步死的。' + NL + NL + 'run: ' + run;
          }
          fs.writeFileSync('issue-body.md', body + NL);
          console.log(body);
          "
          EXISTING=$(gh issue list --state open --search '[status-probe] in:title' --json number --jq '.[0].number' || true)
          if [ -z "${EXISTING}" ]; then
            gh issue create --title "[status-probe] 外部拨测失败 $(date -u +%m-%d\ %H:%M)Z" --body-file issue-body.md
          else
            gh issue comment "${EXISTING}" --body-file issue-body.md || true
          fi
