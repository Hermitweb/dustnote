name: Release

on:
  push:
    tags:
      - 'v*'

env:
  NODE_VERSION: '20'
  PNPM_VERSION: '9.12.0'

jobs:
  build-web:
    name: Build Web
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @dustnote/shared build
      - run: pnpm --filter @dustnote/web build
      - run: zip -r web-dist.zip web/dist/
      - uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: web-dist.zip

  build-miniprogram:
    name: Build Miniprogram H5
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @dustnote/shared build
      - run: pnpm --filter @dustnote/miniprogram build:h5
      - run: zip -r miniprogram-dist.zip miniprogram/dist/
      - uses: actions/upload-artifact@v4
        with:
          name: miniprogram-dist
          path: miniprogram-dist.zip

  build-desktop:
    name: Build Desktop
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'
      - uses: dtolnay/rust-toolchain@stable
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @dustnote/shared build
      - name: Build Desktop frontend
        working-directory: desktop
        run: pnpm build:web
      - name: Build Desktop Rust
        working-directory: desktop/src-tauri
        run: cargo build --release
      - name: Build Desktop installer
        working-directory: desktop
        run: pnpm tauri build --bundle-only
      - name: List bundle files
        run: Get-ChildItem -Recurse -Filter "*.exe" desktop/src-tauri/target/release/bundle 2>$null | Select-Object FullName
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-installers
          path: desktop/src-tauri/target/release/bundle/**/*.exe

  build-mobile:
    name: Build Mobile Android
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: 17
      - name: Install Android SDK
        uses: android-actions/setup-android@v3
        with:
          api-level: 34
          build-tools: 34.0.0
          ndk: 26.1.10909125
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @dustnote/shared build
      - run: chmod +x mobile/android/gradlew
      - name: Build Android APK
        working-directory: mobile/android
        run: ./gradlew assembleRelease
      - uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: mobile/android/app/build/outputs/apk/release/app-release.apk

  create-release:
    name: Create Release
    runs-on: ubuntu-latest
    needs: [build-web, build-miniprogram, build-desktop, build-mobile]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: List artifacts
        run: find artifacts -type f -name "*.zip" -o -name "*.exe" -o -name "*.apk" 2>/dev/null || ls -laR artifacts
      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          append_files: true
          body: |
            ## 🎉 DustNote Release ${{ github.ref_name }}

            ### 📦 Build Artifacts

            **Web:**
            - [web-dist.zip](https://github.com/Hermitweb/dustnote/releases/download/${{ github.ref_name }}/web-dist.zip)

            **Miniprogram H5:**
            - [miniprogram-dist.zip](https://github.com/Hermitweb/dustnote/releases/download/${{ github.ref_name }}/miniprogram-dist.zip)

            **Desktop:**
            - [DustNote_*-setup.exe](https://github.com/Hermitweb/dustnote/releases/download/${{ github.ref_name }}/DustNote_*-setup.exe)

            **Mobile:**
            - [app-release.apk](https://github.com/Hermitweb/dustnote/releases/download/${{ github.ref_name }}/app-release.apk)

            ### ✅ Platforms Built
            - ✅ Web
            - ✅ Miniprogram H5
            - ✅ Desktop (Windows)
            - ✅ Mobile Android

            ### 📝 Changelog
            See [commits](https://github.com/Hermitweb/dustnote/commits/${{ github.ref_name }}) for details.
          files: |
            artifacts/web-dist/web-dist.zip
            artifacts/miniprogram-dist/miniprogram-dist.zip
            artifacts/desktop-installers/**/*.exe
            artifacts/android-apk/app-release.apk
