name: Release

on:
  push:
    tags:
      - 'v*'
    branches:
      # Allow the initial release to be cut without a manually-pushed tag.
      # Revert to tag-only after v0.1.0 is published.
      - dev/setup-and-fixes

env:
  NODE_VERSION: '20'
  PNPM_VERSION: '9.12.0'
  # Use the tag name when triggered by a tag; fall back to v0.1.0 for the
  # branch-triggered initial release.
  RELEASE_TAG: ${{ github.ref_type == 'tag' && github.ref_name || 'v0.1.0' }}

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-web:
    name: Build Web
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @dustnote/shared build
      - run: pnpm --filter @dustnote/web build
      - run: zip -r web-dist.zip web/dist/
      - uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: web-dist.zip

  build-miniprogram:
    name: Build Miniprogram H5
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @dustnote/shared build
      - run: pnpm --filter @dustnote/miniprogram build:h5
      - run: zip -r miniprogram-dist.zip miniprogram/dist/
      - uses: actions/upload-artifact@v4
        with:
          name: miniprogram-dist
          path: miniprogram-dist.zip

  build-desktop:
    name: Build Desktop
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'
      - uses: dtolnay/rust-toolchain@stable
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @dustnote/shared build
      - name: Build Desktop installer
        working-directory: desktop
        run: pnpm tauri build
      - name: List bundle files
        run: Get-ChildItem -Recurse -Filter "*.exe" desktop/src-tauri/target/release/bundle 2>$null | Select-Object FullName
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-installers
          path: desktop/src-tauri/target/release/bundle/**/*.exe

  build-mobile:
    name: Build Mobile Android
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: 17
      - name: Install Android SDK & NDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-34 build-tools;34.0.0 ndk;26.1.10909125'
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @dustnote/shared build
      - name: Verify react-native install location
        run: |
          echo "Checking react-native at workspace root..."
          ls -la node_modules/react-native/ReactAndroid/gradle.properties || echo "NOT FOUND at root"
          echo "Checking react-native at mobile/node_modules..."
          ls -la mobile/node_modules/react-native 2>/dev/null || echo "Not at mobile/node_modules (expected with hoisted layout)"
      - run: chmod +x mobile/android/gradlew
      - name: Build Android APK
        working-directory: mobile/android
        run: ./gradlew assembleRelease --stacktrace 2>&1 | tee build-output.log
      - name: Verify APK exists
        working-directory: mobile/android
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          echo "=== APK output directory ==="
          find app/build/outputs -type f 2>/dev/null || echo "No outputs directory found"
          echo "=== All APK files under app/build ==="
          find app/build -type f -name "*.apk" 2>/dev/null || echo "No APK files found"
          if ! test -f app/build/outputs/apk/release/app-release.apk; then
            echo "::error::app-release.apk not found at app/build/outputs/apk/release/"
            # Create a GitHub issue with the build log so we can diagnose
            # without admin log access.
            BUILD_LOG=$(tail -150 build-output.log)
            BODY=$(jq -n --arg log "$BUILD_LOG" '{title: "Android build: APK not generated", body: ("Build log (last 150 lines):\n\n```\n" + $log + "\n```\n\n@Hermitweb please investigate why `./gradlew assembleRelease` succeeds but no APK is produced at `app/build/outputs/apk/release/app-release.apk`.")}')
            curl -s -X POST \
              -H "Authorization: token ${GH_TOKEN}" \
              -H "Accept: application/vnd.github.v3+json" \
              "https://api.github.com/repos/${REPO}/issues" \
              -d "$BODY"
            exit 1
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: build-output-log
          path: mobile/android/build-output.log
          if-no-files-found: warn
      - uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: mobile/android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error

  create-release:
    name: Create Release
    runs-on: ubuntu-latest
    needs: [build-web, build-miniprogram, build-desktop, build-mobile]
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: List and prepare release assets
        run: |
          ls -laR artifacts || true
          mkdir -p release-assets
          # Copy all build outputs into a flat directory so the release action
          # can attach them with a simple glob, regardless of the nested
          # structure produced by download-artifact.
          find artifacts -type f \( -name "*.zip" -o -name "*.exe" -o -name "*.apk" \) -exec cp {} release-assets/ \;
          {
            echo "## Release Assets"
            echo '```'
            ls -la release-assets
            echo '```'
          } >> $GITHUB_STEP_SUMMARY
      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: ${{ env.RELEASE_TAG }}
          append_files: true
          body: |
            ## 🎉 DustNote Release ${{ env.RELEASE_TAG }}

            ### 📦 Build Artifacts

            **Web:**
            - [web-dist.zip](https://github.com/Hermitweb/dustnote/releases/download/${{ env.RELEASE_TAG }}/web-dist.zip)

            **Miniprogram H5:**
            - [miniprogram-dist.zip](https://github.com/Hermitweb/dustnote/releases/download/${{ env.RELEASE_TAG }}/miniprogram-dist.zip)

            **Desktop:**
            - [DustNote_*-setup.exe](https://github.com/Hermitweb/dustnote/releases/download/${{ env.RELEASE_TAG }}/DustNote_*-setup.exe)

            **Mobile:**
            - [app-release.apk](https://github.com/Hermitweb/dustnote/releases/download/${{ env.RELEASE_TAG }}/app-release.apk)

            ### ✅ Platforms Built
            - ✅ Web
            - ✅ Miniprogram H5
            - ✅ Desktop (Windows)
            - ✅ Mobile Android

            ### 📝 Changelog
            See [commits](https://github.com/Hermitweb/dustnote/commits/${{ env.RELEASE_TAG }}) for details.
          files: |
            release-assets/*
