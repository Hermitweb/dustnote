name: Release

on:
  push:
    tags:
      - 'v*'
    branches:
      # Allow the initial release to be cut without a manually-pushed tag.
      # Revert to tag-only after v0.1.0 is published.
      - dev/setup-and-fixes

env:
  NODE_VERSION: '20'
  PNPM_VERSION: '9.12.0'
  # Use the tag name when triggered by a tag; fall back to v0.1.0 for the
  # branch-triggered initial release.
  RELEASE_TAG: ${{ github.ref_type == 'tag' && github.ref_name || 'v0.1.0' }}

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-web:
    name: Build Web
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @dustnote/shared build
      - run: pnpm --filter @dustnote/web build
      - run: zip -r web-dist.zip web/dist/
      - uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: web-dist.zip

  build-miniprogram:
    name: Build Miniprogram H5
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @dustnote/shared build
      - run: pnpm --filter @dustnote/miniprogram build:h5
      - run: zip -r miniprogram-dist.zip miniprogram/dist/
      - uses: actions/upload-artifact@v4
        with:
          name: miniprogram-dist
          path: miniprogram-dist.zip

  build-desktop:
    name: Build Desktop (${{ matrix.channel }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            channel: win
            runtime: win-x64
            main_exe: dustnote-desktop.exe
          - os: macos-latest
            channel: macos
            runtime: osx-arm64
            main_exe: dustnote-desktop
          - os: ubuntu-22.04
            channel: linux
            runtime: linux-x64
            main_exe: dustnote-desktop
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'
      - uses: dtolnay/rust-toolchain@stable
      - name: Add macOS Rust targets
        if: matrix.os == 'macos-latest'
        run: rustup target add aarch64-apple-darwin x86_64-apple-darwin
      - name: Install Linux system dependencies
        if: matrix.os == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Install vpk (Velopack CLI)
        run: dotnet tool install -g vpk
      - name: Add vpk to PATH (Windows)
        if: matrix.os == 'windows-latest'
        run: echo "$env:USERPROFILE\.dotnet\tools" >> $env:GITHUB_PATH
      - name: Add vpk to PATH (Unix)
        if: matrix.os != 'windows-latest'
        run: echo "$HOME/.dotnet/tools" >> $GITHUB_PATH
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @dustnote/shared build
      - name: Build Tauri binary (no bundle — Velopack handles installer)
        working-directory: desktop
        run: pnpm tauri build --no-bundle
      - name: Prepare staging directory
        shell: bash
        run: |
          mkdir -p desktop/src-tauri/staging
          cp desktop/src-tauri/target/release/${{ matrix.main_exe }} desktop/src-tauri/staging/
          echo "=== Staging directory contents ==="
          ls -la desktop/src-tauri/staging/
      - name: Pack with Velopack
        working-directory: desktop/src-tauri
        shell: bash
        continue-on-error: ${{ matrix.os == 'macos-latest' }}
        env:
          VPK_VERSION: ${{ github.ref_type == 'tag' && github.ref_name || 'v0.1.0' }}
        run: |
          ver="${VPK_VERSION#v}"
          vpk pack --packId DustNote --packVersion "$ver" --packDir staging --mainExe ${{ matrix.main_exe }} --channel ${{ matrix.channel }} --runtime ${{ matrix.runtime }} --icon icons/icon.ico
      - name: List Velopack outputs
        if: always()
        shell: bash
        run: |
          echo "=== Releases directory (vpk output) ==="
          ls -la desktop/src-tauri/Releases/ 2>/dev/null || echo "No Releases dir found"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: desktop-velopack-${{ matrix.channel }}
          path: |
            desktop/src-tauri/Releases/
          if-no-files-found: ignore

  build-mobile:
    name: Build Mobile Android
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write
      issues: write
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: 17
      - name: Install Android SDK & NDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-34 build-tools;34.0.0 ndk;26.1.10909125'
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @dustnote/shared build
      - name: Symlink react-native into mobile/node_modules (pnpm hoisted layout)
        run: |
          mkdir -p mobile/node_modules
          for pkg in react-native @react-native @react-native-community; do
            if [ ! -e "mobile/node_modules/$pkg" ] && [ -e "node_modules/$pkg" ]; then
              ln -s "$(pwd)/node_modules/$pkg" "mobile/node_modules/$pkg"
            fi
          done
      - run: chmod +x mobile/android/gradlew
      - name: Build Android APK
        working-directory: mobile/android
        run: set -o pipefail && ./gradlew assembleRelease --stacktrace 2>&1 | tee build-output.log
      - name: Verify APK exists
        working-directory: mobile/android
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! test -f app/build/outputs/apk/release/app-release.apk; then
            echo "::error::app-release.apk not found"
            exit 1
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: mobile/android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error

  create-release:
    name: Create Release
    runs-on: ubuntu-latest
    needs: [build-web, build-miniprogram, build-desktop, build-mobile]
    if: always()  # 即使部分平台失败也创建 Release（如 macOS vpk pack 需要 .app bundle）
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: List and prepare release assets
        run: |
          ls -laR artifacts || true
          mkdir -p release-assets
          # vpk pack 输出到 desktop/src-tauri/Releases/，上传后结构为
          # artifacts/desktop-velopack-<channel>/Releases/<files>
          # 将所有构建产物扁平复制到 release-assets/
          find artifacts -type f \( -name "*.zip" -o -name "*.exe" -o -name "*.apk" -o -name "*.nupkg" -o -name "*.delta" -o -name "releases.*.json" -o -name "RELEASES" -o -name "assets.*.json" \) -exec cp {} release-assets/ \;
          # 重命名 Velopack Setup 文件为 Release body 中引用的标准名称
          for channel in win macos linux; do
            src_dir="artifacts/desktop-velopack-${channel}/Releases"
            if [ -d "$src_dir" ]; then
              # 复制 Releases/ 下的所有文件到 release-assets/
              cp "$src_dir"/* release-assets/ 2>/dev/null || true
              # 重命名 Setup 文件
              if [ "$channel" = "win" ]; then
                for f in "$src_dir"/DustNote-win-Setup.exe "$src_dir"/Setup.exe; do
                  if [ -f "$f" ]; then cp "$f" release-assets/Setup.exe; break; fi
                done
              else
                for f in "$src_dir"/DustNote-${channel}-Setup "$src_dir"/Setup; do
                  if [ -f "$f" ]; then cp "$f" "release-assets/Setup-${channel}"; break; fi
                done
              fi
            fi
          done
          ls -la release-assets
      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: ${{ env.RELEASE_TAG }}
          append_files: true
          body: |
            ## 🎉 DustNote Release ${{ env.RELEASE_TAG }}

            ### 📦 Build Artifacts

            **Web:**
            - [web-dist.zip](https://github.com/Hermitweb/dustnote/releases/download/${{ env.RELEASE_TAG }}/web-dist.zip)

            **Miniprogram H5:**
            - [miniprogram-dist.zip](https://github.com/Hermitweb/dustnote/releases/download/${{ env.RELEASE_TAG }}/miniprogram-dist.zip)

            **Desktop (Velopack installer with auto-update):**
            - Windows: [Setup.exe](https://github.com/Hermitweb/dustnote/releases/download/${{ env.RELEASE_TAG }}/Setup.exe)
            - macOS: [Setup-macos](https://github.com/Hermitweb/dustnote/releases/download/${{ env.RELEASE_TAG }}/Setup-macos)
            - Linux: [Setup-linux](https://github.com/Hermitweb/dustnote/releases/download/${{ env.RELEASE_TAG }}/Setup-linux)
            - Update feed: releases.*.json + delta packages (for in-app auto-update)

            **Mobile:**
            - [app-release.apk](https://github.com/Hermitweb/dustnote/releases/download/${{ env.RELEASE_TAG }}/app-release.apk)

            ### ✅ Platforms Built
            - ✅ Web
            - ✅ Miniprogram H5
            - ✅ Desktop (Windows / macOS / Linux)
            - ✅ Mobile Android

            ### 📝 Changelog
            See [commits](https://github.com/Hermitweb/dustnote/commits/${{ env.RELEASE_TAG }}) for details.
          files: |
            release-assets/*
