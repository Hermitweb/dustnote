    <script>
      // 注册 Service Worker（仅生产环境）
      if ('serviceWorker' in navigator && location.protocol === 'https:') {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js').catch((err) => {
            console.warn('[SW] registration failed:', err);
          });
        });
      }
    </script>
  </body>
